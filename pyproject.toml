[project]
name = "cloud-fidelity-lab"
version = "0.1.0"
description = "AWS infrastructure contract testing with Terraform and AWS Emulator"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.35,<2",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "contract: validates deployed infrastructure contracts",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools]
packages = []
